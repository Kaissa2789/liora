<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liora — Page introuvable</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #26121a; --ground-soft: #2f1822; --ivory: #ece4d8; --ivory-dim: #cfc3b6;
    --muted: #a98c86; --rose: #d2a08f; --line: rgba(236,228,216,0.14); --line-strong: rgba(236,228,216,0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--ground); color: var(--ivory); font-family: 'Jost', -apple-system, system-ui, sans-serif;
    font-weight: 300; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

  header { padding: 34px 0; border-bottom: 1px solid var(--line); }
  .header-inner { display: flex; justify-content: space-between; align-items: center; }
  .mark { font-family: 'Cormorant Garamond', serif; font-size: 1.45rem; letter-spacing: 0.14em; }
  .header-nav { display: flex; gap: 26px; align-items: center; }
  .nav-cta { font-size: 0.82rem; letter-spacing: 0.1em; color: var(--ivory-dim); padding-bottom: 3px;
    border-bottom: 1px solid var(--line-strong); transition: color 0.35s, border-color 0.35s; }
  .nav-cta:hover, .nav-cta.current { color: var(--rose); border-color: var(--rose); }

  .intro { text-align: center; padding: 96px 28px 40px; }
  .intro .kicker { font-size: 0.82rem; letter-spacing: 0.28em; color: var(--rose); margin-bottom: 26px; }
  .intro h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.4rem,5.5vw,4rem);
    line-height: 1.1; max-width: 18ch; margin: 0 auto; }
  .intro h1 em { font-style: italic; }

  .story { max-width: 660px; margin: 0 auto; padding: 40px 28px 20px; }
  .story p { font-size: 1.08rem; color: var(--ivory-dim); line-height: 1.85; margin-bottom: 1.6em; }
  .story p.lead { color: var(--ivory); }
  .pullquote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    font-size: clamp(1.8rem,4vw,2.6rem); line-height: 1.3; color: var(--ivory);
    text-align: center; margin: 48px auto; max-width: 20ch; }
  .signature { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.35rem;
    color: var(--rose); margin-top: 40px; }

  .closing { text-align: center; padding: 80px 28px 80px; border-top: 1px solid var(--line); margin-top: 60px; }
  .closing h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2rem,4.5vw,3.2rem);
    max-width: 20ch; margin: 0 auto 34px; line-height: 1.12; }
  .btn { display: inline-block; background: var(--ivory); color: #2a1119; font-size: 0.9rem; letter-spacing: 0.08em;
    padding: 16px 40px; border: 1px solid var(--ivory); transition: background 0.4s, color 0.4s; }
  .btn:hover { background: transparent; color: var(--ivory); }

  footer { padding: 52px 0; border-top: 1px solid var(--line); }
  .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  footer .mark { font-size: 1.2rem; }
  footer small { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; }

  @media (max-width: 720px) {
    .intro { padding: 64px 20px 30px; }
    .header-nav { gap: 15px; }
    .nav-cta { font-size: 0.72rem; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="mark"><a href="index.html">Liora</a></div>
      <nav class="header-nav">
        <a href="histoire.html" class="nav-cta">Notre histoire</a>
        <a href="annonces.html" class="nav-cta">Nos annonces</a>
        <a href="index.html#candidature" class="nav-cta">Candidature</a>
      </nav>
    </div>
  </header>

  <section class="intro" style="padding-top:140px;">
    <p class="kicker">Page introuvable</p>
    <h1>Cette page s'est <em>égarée</em>.</h1>
  </section>
  <section class="closing" style="border-top:0;margin-top:0;padding-top:30px;padding-bottom:140px;">
    <a href="index.html" class="btn">Retour à l'accueil</a>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <div class="mark">Liora</div>
      <small>Paris — Sur candidature uniquement · <a href="confidentialite.html" style="border-bottom:1px solid var(--line-strong);">Mentions légales &amp; confidentialité</a></small>
    </div>
  </footer>
</body>
</html>
